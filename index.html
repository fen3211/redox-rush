<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redox Rush — ионно-электронный баланс</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b33; --panel2:#1b2442; --line:#2a3560;
    --txt:#e8ecff; --mut:#9aa5cc; --acc:#a3e635; --acc2:#22d3ee; --bad:#fb7185; --gold:#facc15;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1e2a5a 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
  .logo{font-weight:900;font-size:22px;letter-spacing:.5px}
  .logo span{color:var(--acc)}
  .hud{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
  .pill.hp{color:var(--bad)} .pill.xp{color:var(--acc)} .pill.lvl{color:var(--acc2)}
  .bar{height:10px;background:#0a0e1f;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0 20px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  h1{font-size:32px;margin:0 0 8px;line-height:1.1}
  h2{font-size:22px;margin:0 0 8px}
  p.sub{color:var(--mut);margin:0 0 20px;line-height:1.6}
  .btn{appearance:none;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer;background:var(--acc);color:#0b1020;transition:transform .08s,filter .15s;width:100%;margin-top:10px}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .btn.cyan{background:var(--acc2)}
  .opts{display:grid;gap:10px;margin-top:16px}
  .opt{text-align:left;background:#0e1530;border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--acc2);background:#131c3d}
  .opt.ok{border-color:var(--acc);background:rgba(163,230,53,.12)}
  .opt.fail{border-color:var(--bad);background:rgba(251,113,133,.12);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .eq{background:#070b1d;border:1px dashed var(--line);border-radius:14px;padding:16px;font-family:Consolas,monospace;font-size:18px;text-align:center;margin:14px 0;line-height:2}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:560px){.grid3{grid-template-columns:1fr} h1{font-size:26px}}
  label.mini{display:block;background:#070b1d;border:1px solid var(--line);border-radius:14px;padding:12px}
  label.mini span{display:block;font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
  label.mini input{width:100%;background:#0e1530;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:20px;font-weight:800;text-align:center;outline:none}
  label.mini input:focus{border-color:var(--acc2)}
  .coef-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font-family:Consolas,monospace;font-size:17px}
  .coef-row input{width:56px;background:#0e1530;border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:8px;font-size:18px;font-weight:900;text-align:center}
  .fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.55;display:none}
  .fb.ok{display:block;background:rgba(163,230,53,.12);border:1px solid var(--acc)}
  .fb.bad{display:block;background:rgba(251,113,133,.12);border:1px solid var(--bad)}
  .fb b{display:block;margin-bottom:4px}
  .tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#0b1020;background:var(--gold);border-radius:999px;padding:4px 10px;margin-bottom:10px}
  .tag.cyan{background:var(--acc2)} .tag.lime{background:var(--acc)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .kbd{font-family:monospace;background:#070b1d;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .pack{border:1px solid var(--line);background:#0e1530;border-radius:16px;padding:16px;margin-top:10px}
  .pack b{font-size:17px} .pack p{color:var(--mut);margin:6px 0 12px;font-size:14px;line-height:1.5}
  footer{color:var(--mut);font-size:13px;text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">REDOX<span>RUSH</span></div>
    <div class="hud">
      <div class="pill lvl" id="hudLvl">Выбор пака</div>
      <div class="pill hp" id="hudHp">❤ ❤ ❤</div>
      <div class="pill xp" id="hudXp">0 XP</div>
    </div>
  </header>
  <div class="bar"><i id="progress"></i></div>
  <div class="card" id="screen"></div>
  <footer>Ионно-электронный баланс = метод полуреакций. O — водой, H — H⁺/OH⁻, заряд — e⁻. <br>Пак 1: Mn + S · Пак 2: азотка + железо + медь.</footer>
</div>

<script>
const LEVELS = ["Разведка: степени окисления","Полуреакции в кислой среде","Среда решает","Босс: собери уравнение"];

const PACK1 = [
  {lvl:0, type:'quiz', q:'Степень окисления Mn в MnO₄⁻?', opts:['+7','+4','+2','+6'], correct:0,
   explain:'4 кислорода по -2 = -8. Весь ион -1, значит Mn = +7. Максимум, дальше только падать.'},
  {lvl:0, type:'quiz', q:'Кто тут окислитель: MnO₄⁻ или SO₃²⁻?', opts:['MnO₄⁻ (забирает e⁻)','SO₃²⁻ (забирает e⁻)'], correct:0,
   explain:'Mn +7 → +2 падает = забирает e⁻ = окислитель. S +4 → +6 растет = отдает = восстановитель.'},
  {lvl:0, type:'quiz', q:'Окисление — это...', opts:['отдать e⁻, степень выросла','забрать e⁻, степень упала','отдать H₂O'], correct:0,
   explain:'Отдал электроны — окислился. Забрал — восстановился.'},
  {lvl:0, type:'quiz', q:'Сера SO₃²⁻ → SO₄²⁻. Сколько e⁻ отдает?', opts:['2','5','3','8'], correct:0,
   explain:'+4 → +6, разница 2. Значит отдать 2e⁻.'},
  {lvl:1, type:'half', title:'MnO₄⁻ → Mn²⁺ (кислая среда)', prompt:'Уравняй: добавь H⁺, H₂O и e⁻. Порядок: O водой, потом H водородом, потом заряд электронами.',
   ans:{h:8,h2o:4,e:5}, explain:'MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O. O добили 4H₂O, H добили 8H⁺, заряд выровняли 5e⁻.'},
  {lvl:1, type:'half', hSide:'right', title:'SO₃²⁻ → SO₄²⁻ (кислая среда)', prompt:'Сера 1:1. Внимание: тут H⁺ получится СПРАВА. Вбей: сколько H⁺ справа, сколько H₂O слева, сколько e⁻.',
   ans:{h:2,h2o:1,e:2}, explain:'SO₃²⁻ + H₂O → SO₄²⁻ + 2H⁺ + 2e⁻. O 3→4 = +1H₂O слева, справа 2H⁺, отдать 2e⁻.'},
  {lvl:1, type:'half', title:'Cr₂O₇²⁻ → 2Cr³⁺ (кислая среда)', prompt:'Дихромат — классика. Хром уже 2:2. Сколько H⁺ / H₂O / e⁻?',
   ans:{h:14,h2o:7,e:6}, explain:'Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O.'},
  {lvl:2, type:'quiz', q:'MnO₄⁻ + SO₃²⁻ в НЕЙТРАЛЬНОЙ среде. Во что упадет Mn?', opts:['MnO₂ (бурый осадок, +4)','Mn²⁺ (бесцветный)','MnO₄²⁻ (зеленый)'], correct:0,
   explain:'Кислота жрет до +2, нейтраль до +4 (MnO₂), щелочь до +6.'},
  {lvl:2, type:'quiz', q:'В щелочной среде чем балансим H и O?', opts:['H₂O и OH⁻, никаких H⁺','только H⁺','на глазок'], correct:0,
   explain:'В щелочи H⁺ запрещен. Работаем парой H₂O / OH⁻.'},
  {lvl:2, type:'half', title:'MnO₄⁻ → MnO₂ (нейтральная среда)', prompt:'Баланс через H₂O / OH⁻. Введи: H₂O слева, OH⁻ справа, e⁻.', mode:'neutral',
   ans:{h2o:2,oh:4,e:3}, explain:'MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻.'},
  {lvl:3, type:'full', title:'БОСС: MnO₄⁻ жрет сульфит', prompt:'Вбей 6 коэффициентов по порядку.', labels:['MnO₄⁻','SO₃²⁻','H⁺','Mn²⁺','SO₄²⁻','H₂O'],
   ans:[2,5,6,2,5,3], explain:'НОК 5 и 2 = 10. Первую x2, вторую x5, сложить и сократить. Проверка зарядом: -6 = -6.'},
  {lvl:3, type:'full', title:'ФИНАЛ: дихромат жрет железо', prompt:'Вбей 6 коэффициентов по порядку.', labels:['Cr₂O₇²⁻','Fe²⁺','H⁺','Cr³⁺','Fe³⁺','H₂O'],
   ans:[1,6,14,2,6,7], explain:'Cr берет 6e⁻, Fe отдает 1e⁻. Значит Fe x6. Дальше 7H₂O и 14H⁺.'},
];

const PACK2 = [
  {lvl:0, type:'quiz', q:'Степень окисления Cr в Cr₂O₇²⁻?', opts:['+6','+7','+3','+4'], correct:0,
   explain:'7 O = -14, ион -2. Значит 2Cr = +12, один Cr = +6.'},
  {lvl:0, type:'quiz', q:'Медь + КОНЦЕНТРИРОВАННАЯ HNO₃. Что выделится?', opts:['NO₂ (бурый газ)','NO (бесцветный)','NH₄⁺ (в раствор)','H₂ (водород)'], correct:0,
   explain:'Конц. азотка восстанавливается неглубоко: +5 → +4 (NO₂). Разбавленная с медью даст NO (+5→+2), а с цинком очень разбавленная — NH₄⁺ (+5→-3). Чем активнее металл и жиже кислота — тем глубже падение.'},
  {lvl:0, type:'quiz', q:'Fe²⁺ → Fe³⁺. Сколько e⁻?', opts:['отдает 1','забирает 1','отдает 2','забирает 5'], correct:0,
   explain:'+2 → +3, вырос на 1 = отдал 1e⁻. Самый простой восстановитель.'},
  {lvl:0, type:'quiz', q:'N: NO₃⁻ (+5) → NO (+2). Сколько e⁻ берет?', opts:['3','1','5','8'], correct:0,
   explain:'+5 → +2, разница 3. Берет 3e⁻. Это разбавленная азотка.'},
  {lvl:1, type:'half', title:'NO₃⁻ → NO (разб. HNO₃)', prompt:'Классика: медь в разбавленной азотке. Сколько H⁺ (слева) / H₂O (справа) / e⁻?',
   ans:{h:4,h2o:2,e:3}, explain:'NO₃⁻ + 4H⁺ + 3e⁻ → NO + 2H₂O. O 3→1: не хватает 2 O справа? Нет: слева 3 O, справа 1 в NO + 2 в воде = 3. Сошлось.'},
  {lvl:1, type:'half', title:'NO₃⁻ → NO₂ (конц. HNO₃)', prompt:'Концентрированная азотка. Падение неглубокое, всего 1 электрон. Сколько H⁺ / H₂O?',
   ans:{h:2,h2o:1,e:1}, explain:'NO₃⁻ + 2H⁺ + 1e⁻ → NO₂ + H₂O.'},
  {lvl:1, type:'half', hSide:'right', title:'NO₂⁻ → NO₃⁻ (окисление)', prompt:'Нитрит окисляется в нитрат. Тут H⁺ будет СПРАВА. Вбей H⁺ справа / H₂O слева / e⁻.',
   ans:{h:2,h2o:1,e:2}, explain:'NO₂⁻ + H₂O → NO₃⁻ + 2H⁺ + 2e⁻. N +3→+5 отдал 2e⁻.'},
  {lvl:1, type:'half', title:'Fe²⁺ → Fe³⁺', prompt:'Халява. Ни O ни H нет. Сколько e⁻? Остальное нули.',
   ans:{h:0,h2o:0,e:1}, explain:'Fe²⁺ → Fe³⁺ + 1e⁻. Вбивай H=0, H₂O=0, e=1.'},
  {lvl:2, type:'quiz', q:'Zn + ОЧЕНЬ разбавленная HNO₃. Продукт восстановления?', opts:['NH₄⁺ (+5 → -3, 8e⁻)','NO₂','NO','N₂O'], correct:0,
   explain:'Активный металл + жижа = глубокое падение до -3. 8 электронов — самый жесткий случай, его любят на экзаменах.'},
  {lvl:2, type:'quiz', q:'H₂O₂ в реакции с MnO₄⁻ в кислой среде — кто?', opts:['восстановитель (O -1 → 0, отдает e⁻)','окислитель','зритель'], correct:0,
   explain:'H₂O₂ → O₂: O -1 → 0, отдает 2e⁻. Пероксид тут восстановитель, а марганец как обычно жрет.'},
  {lvl:3, type:'full', title:'БОСС: марганцовка жрет железо', prompt:'Классика титрования. Вбей коэффициенты.', labels:['MnO₄⁻','Fe²⁺','H⁺','Mn²⁺','Fe³⁺','H₂O'],
   ans:[1,5,8,1,5,4], explain:'Mn берет 5e⁻, Fe отдает 1e⁻. Значит Fe x5. Итог: MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O.'},
  {lvl:3, type:'full', title:'БОСС: дихромат жрет сульфит', prompt:'Похож на пак 1, но цифры другие. Вбей.', labels:['Cr₂O₇²⁻','SO₃²⁻','H⁺','Cr³⁺','SO₄²⁻','H₂O'],
   ans:[1,3,8,2,3,4], explain:'Cr берет 6e⁻, S отдает 2e⁻. НОК 6. Вторую x3. Итог: Cr₂O₇²⁻ + 3SO₃²⁻ + 8H⁺ → 2Cr³⁺ + 3SO₄²⁻ + 4H₂O.'},
  {lvl:3, type:'full', title:'ФИНАЛ: медь + конц. азотка', prompt:'Cu + NO₃⁻ + H⁺ → Cu²⁺ + NO₂ + H₂O. Медь отдает 2e⁻, азот берет 1e⁻.', labels:['Cu','NO₃⁻','H⁺','Cu²⁺','NO₂','H₂O'],
   ans:[1,2,4,1,2,2], explain:'Cu → Cu²⁺ + 2e⁻, NO₃⁻ + 2H⁺ + 1e⁻ → NO₂ + H₂O (x2). Складываем: Cu + 2NO₃⁻ + 4H⁺ → Cu²⁺ + 2NO₂ + 2H₂O.'},
];

const PACKS = [
  {name:'Пак 1 · Mn + S + Cr', desc:'MnO₄⁻, SO₃²⁻, дихромат + железо. База, которую ты уже прошел.', tasks:PACK1},
  {name:'Пак 2 · Азотка + Fe + Cu', desc:'НОВОЕ: NO₃⁻→NO / NO₂ / NH₄⁺, нитрит, медь в азотке, Mn+Fe, Cr+сульфит. Те же механики, другие цифры.', tasks:PACK2},
];

let TASKS = PACKS[0].tasks;
let packIdx = 0;
let s = {task:0, hp:3, xp:0};
const screen = document.getElementById('screen');
const elHp = document.getElementById('hudHp'), elXp = document.getElementById('hudXp'),
      elLvl = document.getElementById('hudLvl'), elBar = document.getElementById('progress');

function hud(){
  elHp.textContent = '❤ '.repeat(s.hp).trim() || '☠';
  elXp.textContent = s.xp + ' XP';
  const t = TASKS[s.task];
  elLvl.textContent = t ? `${PACKS[packIdx].name.split('·')[0].trim()} · Ур.${t.lvl+1}/4` : 'Финал';
  elBar.style.width = Math.round(s.task / TASKS.length * 100) + '%';
}
function fbOk(msg){ return `<div class="fb ok"><b>✅ Верно</b>${msg}</div>`; }
function fbBad(msg){ return `<div class="fb bad"><b>❌ Минус жизнь. Разбор:</b>${msg}</div>`; }

function render(){
  hud();
  if(s.hp<=0) return gameOver();
  if(s.task>=TASKS.length) return win();
  const t = TASKS[s.task];
  if(t.type==='quiz') return renderQuiz(t);
  if(t.type==='half') return renderHalf(t);
  if(t.type==='full') return renderFull(t);
}

function renderStart(){
  elBar.style.width='0%';
  elLvl.textContent='Выбор пака';
  screen.innerHTML = `
    <div class="tag lime">2 пака · ~25 заданий</div>
    <h1>Redox Rush: выбери пак</h1>
    <p class="sub">Механика везде одна: O — водой, H — H⁺/OH⁻, заряд — e⁻. Меняются только реакции. Пак 1 ты уже вынес — теперь попробуй пак 2 с азоткой.</p>
    ${PACKS.map((p,i)=>`<div class="pack"><b>${i+1}. ${p.name}</b><p>${p.desc} · заданий: ${p.tasks.length}</p><button class="btn ${i===1?'cyan':''}" onclick="start(${i})">▶ ИГРАТЬ ПАК ${i+1}</button></div>`).join('')}
    <button class="btn ghost" onclick="cheat()">📖 Шпаргалка (30 сек)</button>`;
}

function renderQuiz(t){
  screen.innerHTML = `
    <div class="tag cyan">Ур.${t.lvl+1} · ${LEVELS[t.lvl]} · ${s.task+1}/${TASKS.length}</div>
    <h2>${t.q}</h2>
    <div class="opts">${t.opts.map((o,i)=>`<button class="opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
    <div id="fb"></div>`;
}

function renderHalf(t){
  const neutral = t.mode==='neutral';
  const hLabel = neutral ? 'H₂O слева' : (t.hSide==='right' ? 'H⁺ (справа!)' : 'H⁺ (слева)');
  const wLabel = neutral ? 'OH⁻ справа' : (t.hSide==='right' ? 'H₂O (слева)' : 'H₂O (справа)');
  screen.innerHTML = `
    <div class="tag cyan">Ур.${t.lvl+1} · ${LEVELS[t.lvl]} · ${s.task+1}/${TASKS.length}</div>
    <h2>${t.title}</h2>
    <p class="sub">${t.prompt}</p>
    <div class="eq">${t.title}</div>
    <div class="grid3">
      <label class="mini"><span>${hLabel}</span><input id="inA" type="number" min="0" max="20" value="0"></label>
      <label class="mini"><span>${wLabel}</span><input id="inB" type="number" min="0" max="20" value="0"></label>
      <label class="mini"><span>e⁻ (штук)</span><input id="inC" type="number" min="0" max="20" value="0"></label>
    </div>
    <button class="btn cyan" onclick="answerHalf()">ПРОВЕРИТЬ ПОЛУРЕАКЦИЮ</button>
    <div id="fb"></div>`;
}

function renderFull(t){
  const L = t.labels || ['A','B','C','D','E','F'];
  screen.innerHTML = `
    <div class="tag">Ур.${t.lvl+1} · ${LEVELS[t.lvl]} · ${s.task+1}/${TASKS.length}</div>
    <h2>${t.title}</h2>
    <p class="sub">${t.prompt}</p>
    <div class="eq"><div class="coef-row">
      <input id="c0" type="number" min="1" max="14" value="1"> ${L[0]} +
      <input id="c1" type="number" min="1" max="14" value="1"> ${L[1]} +
      <input id="c2" type="number" min="1" max="14" value="1"> ${L[2]} →<br>
      <input id="c3" type="number" min="1" max="14" value="1"> ${L[3]} +
      <input id="c4" type="number" min="1" max="14" value="1"> ${L[4]} +
      <input id="c5" type="number" min="1" max="14" value="1"> ${L[5]}
    </div></div>
    <button class="btn" onclick="answerFull()">СОБРАТЬ УРАВНЕНИЕ</button>
    <div id="fb"></div>`;
}

window.start = (i)=>{ packIdx = (typeof i==='number'?i:0); TASKS = PACKS[packIdx].tasks; s={task:0,hp:3,xp:0}; render(); };
window.cheat = ()=>{
  screen.innerHTML = `
    <div class="tag lime">шпаргалка</div>
    <h2>3 правила</h2>
    <p class="sub">1. <b>O балансим H₂O.</b> 2. <b>H:</b> кислота — H⁺, щелочь — H₂O/OH⁻. 3. <b>Заряд — e⁻.</b> Потом НОК электронов, складываем. Азотка: конц + Cu → NO₂, разб + Cu → NO, очень разб + Zn → NH₄⁺.</p>
    <div class="eq">NO₃⁻ + 4H⁺ + 3e⁻ → NO + 2H₂O</div>
    <button class="btn" onclick="renderStart()">НАЗАД К ПАКАМ</button>`;
};

window.answerQuiz = (i)=>{
  const t = TASKS[s.task];
  const box = document.getElementById('fb');
  const btns = [...document.querySelectorAll('.opt')];
  if(i===t.correct){ s.xp+=100; box.innerHTML = fbOk(t.explain) + `<button class="btn" onclick="next()">ДАЛЬШЕ →</button>`; btns[i].classList.add('ok'); }
  else { s.hp--; btns[i].classList.add('fail'); btns[t.correct].classList.add('ok');
    box.innerHTML = fbBad(t.explain) + `<button class="btn ghost" onclick="next()">ДАЛЬШЕ (${s.hp} ❤)</button>`; }
  hud();
  btns.forEach(b=>b.disabled=true);
};

window.answerHalf = ()=>{
  const t = TASKS[s.task];
  const box = document.getElementById('fb');
  const a=+document.getElementById('inA').value, b=+document.getElementById('inB').value, c=+document.getElementById('inC').value;
  let ok=false;
  if(t.mode==='neutral'){ ok = (a===t.ans.h2o && b===t.ans.oh && c===t.ans.e); }
  else { ok = (a===t.ans.h && b===t.ans.h2o && c===t.ans.e); }
  if(ok){ s.xp+=150; box.innerHTML = fbOk(t.explain) + `<button class="btn" onclick="next()">ДАЛЬШЕ →</button>`; }
  else { s.hp--; box.innerHTML = fbBad(t.explain) + `<button class="btn ghost" onclick="next()">ДАЛЬШЕ (${s.hp} ❤)</button>`; }
  hud();
};

window.answerFull = ()=>{
  const t = TASKS[s.task];
  const v = [0,1,2,3,4,5].map(i=>+document.getElementById('c'+i).value);
  const box = document.getElementById('fb');
  const ok = v.every((x,i)=>x===t.ans[i]);
  if(ok){ s.xp+=200; box.innerHTML = fbOk(t.explain) + `<button class="btn" onclick="next()">ДАЛЬШЕ →</button>`; }
  else { s.hp--; box.innerHTML = fbBad(t.explain + `<br>Ты вбил: ${v.join('-')}, надо: ${t.ans.join('-')}.`) + `<button class="btn ghost" onclick="next()">ДАЛЬШЕ (${s.hp} ❤)</button>`; }
  hud();
};

window.next = ()=>{ s.task++; render(); };

function gameOver(){
  elBar.style.width = Math.round(s.task/TASKS.length*100)+'%';
  screen.innerHTML = `<div class="tag">поражение · ${PACKS[packIdx].name}</div><h1>Жизни кончились</h1>
  <p class="sub">${s.xp} XP, дошел до ${s.task+1}/${TASKS.length}.</p>
  <div class="row2"><button class="btn" onclick="start(${packIdx})">↻ РЕВАНШ</button>
  <button class="btn ghost" onclick="renderStart()">К ПАКАМ</button></div>`;
}
function win(){
  elBar.style.width='100%'; hud();
  const other = packIdx===0?1:0;
  screen.innerHTML = `<div class="tag lime">${PACKS[packIdx].name} пройден · ${s.xp} XP</div><h1>Пак вынесен 👊</h1>
  <p class="sub">Ты закрыл все ${TASKS.length} заданий. Теперь добей второй пак — там другие цифры и азотка.</p>
  <div class="row2"><button class="btn cyan" onclick="start(${other})">▶ ИГРАТЬ ${PACKS[other].name.toUpperCase()}</button>
  <button class="btn ghost" onclick="renderStart()">К ПАКАМ</button></div>`;
}

renderStart();
</script>
</body>
</html>
